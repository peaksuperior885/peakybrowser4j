<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <!-- Background dark gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a24" />
      <stop offset="100%" stop-color="#0b0b0f" />
    </radialGradient>

    <!-- Crimson/Dark Neon cup gradient -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3b4f" />
      <stop offset="50%" stop-color="#1f1f2b" />
      <stop offset="100%" stop-color="#0f0f14" />
    </linearGradient>

    <!-- Red accent glow for steam and details -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ff2a5f" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop shadow for depth -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Plate -->
  <rect width="100" height="100" rx="20" fill="url(#bgGlow)" />

  <!-- Outer Ring Accent -->
  <rect x="8" y="8" width="84" height="84" rx="16" fill="none" stroke="#2a2a3b" stroke-width="1.5" stroke-dasharray="4 2" />

  <!-- Steam / Energy Wisps -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)">
    <path d="M 38 30 C 32 24, 42 18, 38 12" />
    <path d="M 50 28 C 45 22, 55 16, 50 10" />
    <path d="M 62 30 C 58 24, 68 18, 62 12" />
  </g>

  <!-- Saucer -->
  <path d="M 25 74 H 75 C 78 74, 80 77, 77 80 H 23 C 20 77, 22 74, 25 74 Z" fill="#1f1f2b" stroke="#3b3b4f" stroke-width="1" />

  <!-- Coffee Cup Body -->
  <path d="M 30 40 L 35 70 C 35 72, 37 74, 40 74 H 60 C 63 74, 65 72, 65 70 L 70 40 Z" fill="url(#cupGrad)" stroke="#3b3b4f" stroke-width="2" />

  <!-- Cup Rim -->
  <ellipse cx="50" cy="40" rx="20" ry="5" fill="#2a2a3b" stroke="#ff2a5f" stroke-width="1.5" />

  <!-- Dark Liquid inside Cup -->
  <ellipse cx="50" cy="41" rx="17" ry="3.5" fill="#0b0b0f" />

  <!-- Cup Handle -->
  <path d="M 70 45 C 82 45, 82 65, 70 65" fill="none" stroke="#3b3b4f" stroke-width="4" stroke-linecap="round" />
  <path d="M 70 47 C 79 47, 79 63, 70 63" fill="none" stroke="#1f1f2b" stroke-width="1.5" stroke-linecap="round" />

  <!-- Peaky / Razor Edge Details on the Cup -->
  <polygon points="50,48 53,55 47,55" fill="#ff2a5f" filter="url(#neonGlow)" />
  <line x1="42" y1="59" x2="58" y2="59" stroke="#ff2a5f" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
</svg>
