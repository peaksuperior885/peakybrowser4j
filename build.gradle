import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.peak885.peakybrowser4j'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

project.ext.lwjglVersion = "3.3.4"

switch (OperatingSystem.current()) {
    case OperatingSystem.WINDOWS:
        project.ext.lwjglNatives = "natives-windows"
        break
    case OperatingSystem.MAC_OS:
        project.ext.lwjglNatives = "natives-macos"
        break
    default:
        project.ext.lwjglNatives = "natives-linux"
        break
}

dependencies {
    implementation 'blue.endless:jankson:1.2.3'
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'org.tinylog:tinylog-api:2.7.0'
    implementation 'org.tinylog:tinylog-impl:2.7.0'
    implementation 'org.mozilla:rhino-all:1.9.1'
    implementation 'com.ibm.icu:icu4j:75.1'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'org.tinylog:slf4j-tinylog:2.7.0'
    implementation 'it.unimi.dsi:fastutil:8.5.13'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation 'com.helger:ph-css:8.2.1'
    implementation 'com.helger.commons:ph-commons:10.1.0'
    implementation 'com.github.rtyley:animated-gif-lib-for-java:animated-gif-lib-1.7'
    implementation "net.java.dev.jna:jna:5.19.1"
    implementation "net.java.dev.jna:jna-platform:5.19.1"
    implementation "org.bytedeco:javacv-platform:1.5.13"
    implementation 'com.github.TamKungZ:jlayer-custom:1.1.3'

    implementation "org.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-glfw:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-opengl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-nanovg:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-stb:${lwjglVersion}"

    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjglVersion}:${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}:${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-stb:${lwjglVersion}:${lwjglNatives}"

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'com.peak885.peakybrowser4j.Main'
}

shadowJar {
    archiveClassifier.set('all')

    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

test {
    useJUnitPlatform()
}